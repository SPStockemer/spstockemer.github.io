<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S.P. Stockemer | Official Author Website</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #080b10;
  color: #e8e8e8;
  font-family: Georgia, serif;
}

/* CEMETERY BACKGROUND */

.hero {
  position: relative;
  isolation: isolate;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;

  background-image:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.10),
      rgba(0,0,0,.08) 50%,
      rgba(0,0,0,.55)
    ),
    url("Moonlit%20Fog%20Over%20the%20Haunted%20Cemetery.png");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* MOVING FOG BANKS */

.fog {
  position: absolute;
  left: -60%;
  width: 220%;
  height: 55%;
  pointer-events: none;
  z-index: 1;
  will-change: transform;
}

.fog-one {
  bottom: -12%;
  opacity: .85;

  background:
    radial-gradient(
      ellipse 22% 30% at 15% 55%,
      rgba(195,210,225,.58),
      transparent 100%
    ),
    radial-gradient(
      ellipse 25% 32% at 45% 65%,
      rgba(195,210,225,.62),
      transparent 100%
    ),
    radial-gradient(
      ellipse 24% 30% at 78% 55%,
      rgba(195,210,225,.58),
      transparent 100%
    );

  filter: blur(24px);
  animation: driftRight 22s linear infinite alternate;
}

.fog-two {
  bottom: 5%;
  opacity: .65;

  background:
    radial-gradient(
      ellipse 24% 24% at 25% 60%,
      rgba(175,195,215,.52),
      transparent 100%
    ),
    radial-gradient(
      ellipse 28% 28% at 65% 55%,
      rgba(190,205,220,.55),
      transparent 100%
    );

  filter: blur(35px);
  animation: driftLeft 30s linear infinite alternate;
}

.fog-three {
  bottom: -22%;
  opacity: .70;

  background:
    radial-gradient(
      ellipse 35% 35% at 35% 45%,
      rgba(210,220,230,.50),
      transparent 100%
    ),
    radial-gradient(
      ellipse 35% 35% at 75% 50%,
      rgba(195,210,225,.48),
      transparent 100%
    );

  filter: blur(42px);
  animation: driftRight 38s linear infinite alternate-reverse;
}

@keyframes driftRight {
  from {
    transform: translateX(-10%);
  }
  to {
    transform: translateX(10%);
  }
}

@keyframes driftLeft {
  from {
    transform: translateX(10%);
  }
  to {
    transform: translateX(-10%);
  }
}

/* ORIGINAL AUTHOR BYLINE */

.byline {
  position: relative;
  z-index: 3;
  width: min(88%, 1100px);
  height: auto;
  filter: drop-shadow(0 3px 18px rgba(0,0,0,.85));
  animation: reveal 3s ease-out both;
}

@keyframes reveal {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* EXPLORE LINK */

.scroll-cue {
  position: absolute;
  bottom: 30px;
  z-index: 4;
  color: #dedede;
  text-decoration: none;
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
}

/* LOWER HOMEPAGE */

.intro {
  min-height: 45vh;
  padding: 90px 24px;
  text-align: center;
  background: #080b10;
}

.intro h1 {
  font-size: clamp(26px, 4vw, 44px);
  font-weight: normal;
  letter-spacing: 3px;
}

.intro p {
  color: #aaa;
  font-size: 18px;
}

footer {
  padding: 25px;
  text-align: center;
  color: #777;
  font-size: 13px;
}

/* MOBILE */

@media (max-width: 600px) {
  .hero {
    background-position: center;
  }

  .byline {
    width: 96%;
  }

  .fog {
    width: 300%;
    left: -100%;
  }
}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<main>

  <section class="hero" aria-label="S.P. Stockemer">

    <div class="fog fog-one" aria-hidden="true"></div>
    <div class="fog fog-two" aria-hidden="true"></div>
    <div class="fog fog-three" aria-hidden="true"></div>

    <img
      class="byline"
      src="SPS%20BYLINE%20LOGO%20TRANS%20WHT.png"
      alt="S.P. Stockemer"
    >

    <a class="scroll-cue" href="#welcome">
      Explore &#8595;
    </a>

  </section>

  <section class="intro" id="welcome">
    <h1>Welcome to the World of S.P. Stockemer</h1>
    <p>Official Author Website</p>
  </section>

</main>

<footer>
  &copy; 2026 S.P. Stockemer. All rights reserved.
</footer>

</body>
</html>
