<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S.P. Stockemer | Official Author Website</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #080b10;
  color: #e8e8e8;
  font-family: Georgia, serif;
}

/* CEMETERY BACKGROUND */

.hero {
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.10),
      rgba(0,0,0,.08) 50%,
      rgba(0,0,0,.55)
    ),
    url("Moonlit%20Fog%20Over%20the%20Haunted%20Cemetery.png")
      center / cover no-repeat;
}

/* MOVING FOG BANKS */

.fog-bank {
  position: absolute;
  left: 0;
  width: 65vw;
  min-width: 390px;
  height: clamp(95px, 19vh, 220px);
  z-index: 1;
  pointer-events: none;
  opacity: .75;
  filter: blur(15px);
  will-change: transform;
  transform: translate3d(-110vw, 0, 0);
  animation: crossing 17s linear infinite;
}

.fog-bank svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.fog-bank path {
  fill: #d8e4ee;
  fill-opacity: .63;
}

.fog-bank.one {
  top: 61%;
  animation-duration: 16s;
}

.fog-bank.two {
  top: 76%;
  animation-duration: 22s;
  animation-delay: -9s;
  opacity: .65;
  filter: blur(20px);
}

.fog-bank.three {
  top: 48%;
  animation-duration: 28s;
  animation-delay: -18s;
  opacity: .42;
  filter: blur(24px);
}

.fog-bank.two svg {
  transform: scaleX(-1);
}

@keyframes crossing {
  from {
    transform: translate3d(-110vw, 0, 0);
  }
  to {
    transform: translate3d(170vw, 0, 0);
  }
}

/* ORIGINAL AUTHOR BYLINE */

.byline {
  position: relative;
  z-index: 3;
  width: min(88%, 1100px);
  height: auto;
  filter: drop-shadow(0 3px 18px rgba(0,0,0,.85));
  animation: reveal 3s ease-out both;
}

@keyframes reveal {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* EXPLORE LINK */

.scroll-cue {
  position: absolute;
  bottom: 30px;
  z-index: 4;
  color: #dedede;
  text-decoration: none;
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
}

/* LOWER HOMEPAGE */

.intro {
  min-height: 45vh;
  padding: 90px 24px;
  text-align: center;
  background: #080b10;
}

.intro h1 {
  font-size: clamp(26px, 4vw, 44px);
  font-weight: normal;
  letter-spacing: 3px;
}

.intro p {
  color: #aaa;
  font-size: 18px;
}

footer {
  padding: 25px;
  text-align: center;
  color: #777;
  font-size: 13px;
}

/* MOBILE */

@media (max-width: 600px) {
  .byline {
    width: 96%;
  }

  .fog-bank {
    min-width: 310px;
  }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    scroll-behavior: auto !important;
  }

  .fog-bank {
    display: none;
  }
}
</style>
</head>

<body>

<main>
  <section class="hero" aria-label="S.P. Stockemer">

    <div class="fog-bank one" aria-hidden="true">
      <svg viewBox="0 0 800 200" preserveAspectRatio="none">
        <path d="M0 150 C40 105 75 122 120 91 C155 65 190 88 222 64 C270 28 308 76 352 55 C398 27 434 67 474 60 C525 38 545 83 586 75 C638 62 666 109 708 107 C750 106 783 128 800 152 L800 185 C705 168 661 195 570 176 C485 154 439 190 360 174 C280 155 227 194 148 178 C75 161 41 182 0 170Z"/>
      </svg>
    </div>

    <div class="fog-bank two" aria-hidden="true">
      <svg viewBox="0 0 800 200" preserveAspectRatio="none">
        <path d="M0 150 C40 105 75 122 120 91 C155 65 190 88 222 64 C270 28 308 76 352 55 C398 27 434 67 474 60 C525 38 545 83 586 75 C638 62 666 109 708 107 C750 106 783 128 800 152 L800 185 C705 168 661 195 570 176 C485 154 439 190 360 174 C280 155 227 194 148 178 C75 161 41 182 0 170Z"/>
      </svg>
    </div>

    <div class="fog-bank three" aria-hidden="true">
      <svg viewBox="0 0 800 200" preserveAspectRatio="none">
        <path d="M0 150 C40 105 75 122 120 91 C155 65 190 88 222 64 C270 28 308 76 352 55 C398 27 434 67 474 60 C525 38 545 83 586 75 C638 62 666 109 708 107 C750 106 783 128 800 152 L800 185 C705 168 661 195 570 176 C485 154 439 190 360 174 C280 155 227 194 148 178 C75 161 41 182 0 170Z"/>
      </svg>
    </div>

    <img
      class="byline"
      src="SPS%20BYLINE%20LOGO%20TRANS%20WHT.png"
      alt="S.P. Stockemer"
    >

    <a class="scroll-cue" href="#welcome">
      Explore &#8595;
    </a>

  </section>

  <section class="intro" id="welcome">
    <h1>Welcome to the World of S.P. Stockemer</h1>
    <p>Official Author Website</p>
  </section>
</main>

<footer>

</body>
</html>
