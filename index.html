<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S.P. Stockemer | Author</title>
<style>
* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: #080b10;
  color: #e8e8e8;
  font-family: Georgia, serif;
}

.hero {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(to bottom,
      rgba(0,0,0,.18),
      rgba(0,0,0,.10) 50%,
      rgba(0,0,0,.65)),
    url("wide_cinematic_moody_night_cemetery_scene_in_a_d.png")
      center center / cover no-repeat;
}

.hero::before,
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 20% 80%,
      rgba(185,198,210,.22), transparent 45%),
    radial-gradient(ellipse at 75% 90%,
      rgba(190,200,215,.20), transparent 50%);
  filter: blur(38px);
  animation: fogDrift 28s ease-in-out infinite alternate;
}

.hero::after {
  opacity: .65;
  animation-duration: 39s;
  animation-direction: alternate-reverse;
}

@keyframes fogDrift {
  from { transform: translateX(-12%) scale(1.15); }
  to { transform: translateX(12%) scale(1.25); }
}

.byline {
  position: relative;
  z-index: 2;
  width: min(88%, 1100px);
  height: auto;
  filter: drop-shadow(0 3px 18px rgba(0,0,0,.85));
  animation: reveal 3s ease-out both;
}

@keyframes reveal {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.scroll-cue {
  position: absolute;
  bottom: 30px;
  z-index: 3;
  color: #dedede;
  text-decoration: none;
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
}

.intro {
  min-height: 45vh;
  padding: 90px 24px;
  text-align: center;
  background: #080b10;
}

.intro h1 {
  font-size: clamp(26px, 4vw, 44px);
  font-weight: normal;
  letter-spacing: 3px;
}

.intro p {
  color: #aaa;
  font-size: 18px;
}

footer {
  padding: 25px;
  text-align: center;
  color: #777;
  font-size: 13px;
}

@media (max-width: 600px) {
  .hero { background-position: center center; }
  .byline { width: 96%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<main>
  <section class="hero" aria-label="S.P. Stockemer">
    <img
      class="byline"
      src="SPS%20BYLINE%20LOGO%20TRANS%20WHT.png"
      alt="S.P. Stockemer"
    >
    <a class="scroll-cue" href="#welcome">
      Explore &#8595;
    </a>
  </section>

  <section class="intro" id="welcome">
    <h1>Welcome to the World of S.P. Stockemer</h1>
    <p>Official Author Website</p>
  </section>
</main>

<footer>
  &copy; 2026 S.P. Stockemer. All rights reserved.
</footer>

</body>
</html>
